[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-materials-agent"
version = "0.1.0"
description = "AI-driven battery materials R&D closed-loop system based on OpenScience Agent architecture"
readme = "battery_materials_agent_development_manual.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "httpx>=0.24",
    "rdkit>=2023.3",
    "pymatgen>=2023.10",
    "ase>=3.22",
    "pyscf>=2.4",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "watchdog>=3.0",
    "openpyxl>=3.1",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "scikit-learn>=1.3",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
